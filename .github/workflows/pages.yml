name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/**'
      - 'scripts/**'
      - 'styles.css'
      - 'script.js'
      - 'favicon.svg'
      - 'robots.txt'
      - '.pages.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static pages
        run: node scripts/build.mjs
      - name: Check links and assets
        run: node scripts/check.mjs
      - name: Check CMS content behavior
        run: node scripts/test-cms.mjs
      - name: Check publication records and metadata
        run: node scripts/test-publications.mjs
      - name: Check navigation and migrated content
        run: node scripts/test-site-structure.mjs
      - name: Stage deployment files
        run: node scripts/stage-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
